# Repository-level Cargo config: only settings that hold for every clone go here.
#
# Machine-specific overrides (for example, moving the target directory to an external drive) go in the
# `config.local.toml` next to this file. That file is ignored by .gitignore; when it is absent, the include below
# is silently skipped, so a fresh clone builds directly. See `config.local.toml.example` for a template.
#
# Precedence: keys in this file **override** same-named keys pulled in by the include, so do not assign
# settings that should be changeable per machine (such as build.target-dir) here.
include = [{ path = "config.local.toml", optional = true }]

[env]
# pmetal-mlx-sys compiles MLX against macOS 14 APIs. Keep Rust, C++ and the final
# linker on one deployment target so release links do not mix Mach-O objects
# targeting different macOS versions.
MACOSX_DEPLOYMENT_TARGET = { value = "14.0", force = false }
