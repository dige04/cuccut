[package]
name = "subtitle-render"
description = "CucCut's subtitle overlay render kernel: subtitle typesetting and styles, per-word animation, the Designed Caption recipe, transitions, template layers, timeline element composition, DrawOp fingerprints and CPU raster, and the ASS style header; built-in subtitle styles and textures live in `assets/`, and fonts are read from `render-raster`'s built-in fonts. The only implementation shared by burned-in export and preview (ported from CucCut v2 ccut-subtitle-render)"
version.workspace = true
edition.workspace = true
license-file.workspace = true
publish.workspace = true

# The feature table is the same as v2. Builds for WASM use `--no-default-features --features wasm-safe`
# (the combination of v2 `ccut-wasm-subtitle` and `ccut-wasm-editor`).
[features]
default = ["host"]
external-fonts = ["host", "render-raster/external-fonts"]
# Desktop/CLI host: project I/O, media decoding and system fonts.
host = ["render-raster/media", "timeline-render/media", "timeline-render/external-media-scene"]
# The browser compositor only consumes pure typesetting and glyph scenes; fonts and documents are injected by the JS host.
wasm-safe = ["render-raster/wasm-safe", "timeline-render/wasm-safe"]

[dependencies]
# Pure-I/O typesetting / rasterization / DrawOp kernel and effects stack.
render-raster = { workspace = true }
# Timeline document model, clock mapping and `TimelineProjection` (the projection type injected by the host).
timeline = { workspace = true }
# Pure geometry → DrawOp assembly for timeline elements; shared with the preview WASM, so preview and export come from the same source.
timeline-render = { workspace = true }
# Registry of directory-type preset recipes (shape / visualizer / progress).
motion = { workspace = true }
# Pure-function parsing of BCS1 spectra (the pixel input for visualizer elements). The workspace registry has turned `dsp` off.
waveform = { workspace = true }
# Translation projection: `target_delivery_projection` decides which sentences are burned in; `AssStyleSheet` for the ASS style header.
speech-doc = { workspace = true }
anyhow = "1.0"
serde = { version = "1.0.229", features = ["derive"] }
# `float_roundtrip`: v2 turns it on at the workspace level; declared with the crate here.
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }
# v2 uses 0.10; this repo resolves to 0.11, so this repo's version is kept (same as `render-raster`).
sha2 = "0.11.0"
tiny-skia = "0.11.4"
unicode-segmentation = "1.12"

[dev-dependencies]
tempfile = "3"
