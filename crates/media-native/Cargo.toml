[package]
name = "media-native"
description = "CucCut platform-native media primitives: frame extraction, streaming, GPU playback surfaces and MP4 writing via AVFoundation / Media Foundation (ported from CucCut v2 ccut-media-native)"
version.workspace = true
edition.workspace = true
license-file.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0"

# macOS: single frames go through AVFoundation's `AVAssetImageGenerator` + a CoreGraphics bitmap context,
# sequential frame streams go through `AVAssetReader` + `AVAssetReaderTrackOutput` (32BGRA CVPixelBuffer),
# MP4 writing goes through `AVAssetWriter` + `AVAssetWriterInputPixelBufferAdaptor` (WP6b).
# Versions and features are aligned with the objc2 dependencies already present in v2's `core/crates/ccut-kernel`, `apps/cli` and `apps/cuccut`,
# so one dependency tree does not contain two major versions.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
# `finishWritingWithCompletionHandler:` takes an Objective-C block.
block2 = "0.6"
# Shadow-file directory during MP4 writing: `shouldOptimizeForNetworkUse` writes a temp file close to the export size to move moov to the front;
# without an explicit directory it may land beside the user's output folder. Only this platform path needs it, so it is not in the
# cross-platform `[dependencies]`.
tempfile = "3"
objc2-av-foundation = { version = "0.3", default-features = false, features = [
    "AVAsset",
    "AVAssetImageGenerator",
    "AVAssetReader",
    "AVAssetReaderOutput",
    "AVAssetTrack",
    # Preview scrubbing snaps to keyframes: `AVAssetTrack::makeSampleCursor…` and sync info,
    # `AVSampleBufferGenerator` pulls compressed keyframe samples straight from the container to feed a resident decoder.
    "AVSampleCursor",
    "AVSampleBufferGenerator",
    "AVAssetWriter",
    "AVAssetWriterInput",
    "AVMediaFormat",
    "AVVideoSettings",
    # The block parameter of `finishWritingWithCompletionHandler:`.
    "block2",
    "objc2-core-foundation",
    "objc2-core-graphics",
    "objc2-core-media",
    "objc2-core-video",
] }
# Keys for the AAC output settings (`AVFormatIDKey` / `AVEncoderBitRateKey` …).
objc2-avf-audio = { version = "0.3", default-features = false, features = [
    "AVAudioSettings",
] }
# `AudioStreamBasicDescription` and `kAudioFormat*` constants for the mixed PCM.
objc2-core-audio-types = { version = "0.3", default-features = false, features = [
    "CoreAudioBaseTypes",
] }
objc2-core-graphics = { version = "0.3", default-features = false, features = [
    "CGBitmapContext",
    "CGColorSpace",
    "CGContext",
    "CGImage",
] }
objc2-core-foundation = { version = "0.3", default-features = false, features = [
    "CFBase",
    "CFCGTypes",
    # `kCVPixelBufferPixelFormatTypeKey` is a `CFStringRef`: you need the `CFString` type
    # so it can be toll-free bridged to `NSString` in the output settings dictionary.
    "CFString",
    # The target pixel buffer attribute for `VTDecompressionSessionCreate` is a `CFDictionaryRef`.
    "CFDictionary",
] }
# `CMSampleBufferGetImageBuffer` requires `CMSampleBuffer` + `objc2-core-video`;
# `CMTimeRange` limits the starting point of sequential streams. `CMBlockBuffer` / `CMFormatDescription` +
# `objc2-core-audio-types` are for the audio sample buffers that WP6b builds itself (the mixed PCM has no container,
# so the format description and block buffer have to be assembled by hand).
objc2-core-media = { version = "0.3", default-features = false, features = [
    "CMBase",
    "CMBlockBuffer",
    "CMFormatDescription",
    "CMSampleBuffer",
    "CMTime",
    "CMTimeRange",
    "objc2-core-audio-types",
    "objc2-core-video",
] }
objc2-core-video = { version = "0.3", default-features = false, features = [
    "CVBase",
    "CVBuffer",
    "CVImageBuffer",
    "CVPixelBuffer",
    "CVPixelBufferPool",
    "CVReturn",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "NSArray",
    "NSDictionary",
    "NSError",
    "NSObject",
    "NSString",
    "NSURL",
    "NSValue",
] }
# The resident keyframe decoder for preview scrubbing: a long-lived `VTDecompressionSession` decodes
# the keyframe samples pulled out by `AVSampleBufferGenerator`, saving the decoder session cold start that `AVAssetReader` incurs
# on every reopen (1080p H.264 measured at ≈ 50 ms each time).
objc2-video-toolbox = { version = "0.3.2", default-features = false, features = [
    "VTDecompressionSession",
    "VTErrors",
    "VTSession",
    "block2",
    "objc2",
    "objc2-core-media",
    "objc2-core-video",
] }

# Windows: Media Foundation's `IMFSourceReader` decodes RGB32 single frames, and `IMFMediaEngine`
# frame-server writes live frames straight into a shareable D3D11 BGRA texture. Versions and features are aligned with
# the MF export backend in v2's `core/crates/ccut-kernel/src/services/native_video/platform.rs`.
[target.'cfg(target_os = "windows")'.dependencies]
# `windows::core::implement` expands to refer directly to the `windows_core` crate; this is what generating the COM
# `IMFMediaEngineNotify` callback requires, not a duplicate Win32 binding version.
windows-core = "0.62"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D10",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Media_MediaFoundation",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
] }

[dev-dependencies]
tempfile = "3"
# Audio round-trip acceptance (WP6b): decode the written MP4 back to PCM and check RMS and dominant frequency. Versions and features
# are aligned with `render-raster` / `media-probe` (same version and features, so no new compilation unit).
symphonia = { version = "0.6", features = ["all"] }
# Metadata acceptance for the written MP4 (dimensions / duration / presence of an audio track).
media-probe = { workspace = true }
# Cross-backend SSIM comparison (WP5b): the algorithm has been consolidated into `render-raster::imgcmp`, so the test side no longer carries
# its own minimal implementation. Used only as a dev-dependency (not in the production binary); the workspace registry entry is
# `default-features = false`, which turns off `media` (heavy dependencies such as ffmpeg / resvg / cosmic-text that this crate does not need),
# leaving `raster` (tiny-skia) / `imgcmp`, which is enough.
render-raster = { workspace = true }
tiny-skia = "0.11"
