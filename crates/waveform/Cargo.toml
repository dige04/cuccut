[package]
name = "waveform"
description = "CucCut's pure-function format layer for audio-derived data: BCW1 peak envelopes and BCS1 spectra (ported from CucCut v2 ccut-waveform)"
version.workspace = true
edition.workspace = true
license-file.workspace = true
publish.workspace = true

[features]
default = ["dsp"]
# STFT from PCM to BCS1. Only the **producer** of clip spectra turns it on: native export (frame-render's
# `host`) and the editor preview's WASM entry point (preview-wasm, where the UI decodes and this computes); the **consumer** that only reads existing
# BCS1 bytes (render-raster's visualizer source) leaves it off.
dsp = ["dep:realfft"]

[dependencies]
anyhow = "1.0"
# Real FFT used by the STFT; same version as ccut-speech's mel front end, proven usable on all platforms.
realfft = { version = "3.5", optional = true }
