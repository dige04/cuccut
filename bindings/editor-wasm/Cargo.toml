[package]
name = "editor-wasm"
description = "Pure-semantics WASM entry point shared by the UI and Node: sentence derivation and source-text fingerprints for the subtitle and translation core, stage boxes, the engine's value ranges, the element style catalog, speaker identification for existing transcripts, and parsing and snapping of source-embedded chapters (architecture design §1.4, §6.6, §7.9, §13.6)"
version.workspace = true
edition.workspace = true
license-file.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
editor-semantics.workspace = true
motion.workspace = true
render-graph.workspace = true
speech-doc.workspace = true
speech-doc-bridge.workspace = true
timeline.workspace = true
video-model.workspace = true
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }
