[package]
name = "timeline"
description = "Pure-function core of CucCut's timeline semantics: the element model (schema, elements, geometry, effects, transitions, keyframes, animation, sticker color fill, templates), talking-head cut points (detection, source-level cuts, words, text matching, shared criteria), semantic follow and word anchors, voice-based ducking, time mapping, clip layout, patches and on-screen text. No I/O; the algorithms use floating-point seconds internally (ported from CucCut v2 ccut-timeline)"
version.workspace = true
edition.workspace = true
license-file.workspace = true
publish.workspace = true

[dependencies]
motion = { workspace = true }
scene-primitives = { workspace = true }
# v2 pins `regex = "1.12"` at the workspace level; Cargo.lock resolves to 1.13.1, matching this repo.
regex = "1.12"
serde = { version = "1.0.229", features = ["derive"] }
# `float_roundtrip`: a decimal read as f64 must be correctly rounded, the same value as std `str::parse` and JS `JSON.parse`
# (v2 turns it on at the workspace level; declared with the crate here).
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }
unicode-general-category = "1.1"
unicode-normalization = "0.1"
