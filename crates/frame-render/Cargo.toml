[package]
name = "frame-render"
description = "CucCut's frame raster (architecture design §9.3, §13.1): hands the render-graph frame plan to the ported CPU render kernels (subtitle-render, render-raster) to draw one RGBA frame. Native export links it directly; the editor preview uses the same code through preview-wasm"
version.workspace = true
edition.workspace = true
license-file.workspace = true
publish.workspace = true

# Builds for WASM use `--no-default-features --features wasm-safe` (fonts are injected by the host); native export uses the default `host`
# (bundled fonts, clip-spectrum decoding and analysis). SVG rasterization is available on both sides (`render-raster/svg`): SVG in image layers is drawn in the kernel.
[features]
default = ["host"]
external-fonts = ["host", "render-raster/external-fonts", "subtitle-render/external-fonts"]
host = ["subtitle-render/host", "render-raster/media", "waveform/dsp"]
wasm-safe = ["subtitle-render/wasm-safe", "render-raster/wasm-safe", "render-raster/svg"]

[dependencies]
motion.workspace = true
render-graph.workspace = true
render-raster.workspace = true
speech-doc.workspace = true
subtitle-render.workspace = true
timeline.workspace = true
timeline-render.workspace = true
video-model.workspace = true
waveform.workspace = true
anyhow = "1.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tiny-skia = "0.11.4"

[dev-dependencies]
editor-semantics.workspace = true
sha2 = "0.11.0"
