[package]
name = "audio-dsp"
description = "CucCut offline audio DSP primitives: RBJ biquads, time-varying low-pass, polyBLEP oscillators, shaped noise, synthetic IR + FFT convolution, followers, ducking, glue, BS.1770 loudness and 4x true-peak limiting. Pure functions, no I/O, libm-only transcendentals. (Ported from CucCut v2 ccut-audio-dsp.)"
version.workspace = true
edition.workspace = true
license-file.workspace = true
publish.workspace = true

[dependencies]
# Transcendental functions go through libm only (same reason as ccut-motion): the same input yields bit-identical samples on macOS, Windows and Linux.
libm = "0.2.16"

[dev-dependencies]
# An independently implemented EBU R128 measurement (MIT), checked against this crate's own BS.1770 only in tests; it is not in the library's dependency graph:
# its filter coefficients and logarithms use std floating point, so the last digit may differ between platforms, and loudness values feed back into the master gain.
ebur128 = "0.1.10"
