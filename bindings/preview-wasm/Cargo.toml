[package]
name = "preview-wasm"
description = "WASM entry point for the editor preview: the frame plan from render-graph and the frame raster from frame-render (the same implementation as export; architecture design §2, §9.7, §13.1)"
version.workspace = true
edition.workspace = true
license-file.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Fonts are injected by the UI: enable only `wasm-safe` (it carries the SVG raster, so SVG images and sticker recoloring are drawn in the kernel).
frame-render = { workspace = true, features = ["wasm-safe"] }
render-graph.workspace = true
video-model.workspace = true
# Clip spectra are computed here (the UI decodes them and sends them in blocks).
waveform = { workspace = true, features = ["dsp"] }
tiny-skia = "0.11.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
