[package]
name = "model-runtime"
description = "CucCut's public library for local inference: the Model Worker protocol, parent-process supervision, backend abstraction, audio decoding and the speech-recognition pipeline (architecture design §6.5–§6.6)"
version.workspace = true
edition.workspace = true
license-file.workspace = true
publish.workspace = true

[features]
default = ["backend-mlx", "backend-coreml"]
# Apple Silicon only: mlx-rs (Metal) inference. Other platforms still compile with it enabled; the backend just reports itself as unavailable.
backend-mlx = ["dep:mlx-rs", "dep:mlx-sys"]
# Apple Silicon only: Whisper on CoreML (`.mlmodelc`). VAD is still MLX's Silero, so this also enables `backend-mlx`.
# Other platforms compile with it enabled too; the backend just reports itself as unavailable.
backend-coreml = ["backend-mlx", "dep:half", "dep:objc2", "dep:objc2-core-ml", "dep:objc2-foundation"]
# All platforms: candle inference (CPU; NVIDIA GPU when `cuda` is on), covering Qwen3-ASR, MOSS, Qwen-Image and the same model repositories (architecture design §6.5).
backend-candle = ["dep:candle-core", "dep:candle-nn", "dep:safetensors", "dep:rand_chacha", "dep:rand_distr"]
# Optional: candle's NVIDIA CUDA acceleration (Windows/Linux; the build needs the CUDA toolchain).
cuda = ["backend-candle", "candle-core?/cuda", "candle-nn?/cuda"]
# All platforms: Whisper via whisper.cpp (whisper-rs; the build needs cmake and a C++ compiler). VAD and the optional aligner are still candle's, so this also enables
# `backend-candle`. Not in default: on Apple Silicon, Whisper is Core ML, and non-Apple builds enable it explicitly.
whisper-ggml = ["backend-candle", "dep:whisper-rs"]
# whisper.cpp's ggml Vulkan backend: covers AMD / Intel / NVIDIA discrete GPUs and integrated graphics in one go; the build needs the Vulkan SDK (glslc), and at runtime only the vulkan-1 that the GPU driver ships is needed.
whisper-ggml-vulkan = ["whisper-ggml", "whisper-rs?/vulkan"]
# whisper.cpp's Metal backend on macOS, which supports AMD GPUs in Intel Macs; the Metal kernels are embedded by whisper-rs-sys.
whisper-ggml-metal = ["whisper-ggml", "whisper-rs?/metal"]
# whisper.cpp's ggml CUDA backend: Whisper on NVIDIA uses CUDA (ggml-cuda statically linked; at runtime needs cudart / cublas / cublasLt and the GPU driver).
# The build needs the CUDA Toolkit (nvcc; on Windows also CUDA_PATH). Build machines without a GPU must set CMAKE_CUDA_ARCHITECTURES (the packaging script supplies it). Can be enabled together with
# `whisper-ggml-vulkan`; at runtime CUDA takes precedence (ggml registers CUDA first). It is a separate feature from candle's `cuda`. Not yet measured.
whisper-ggml-cuda = ["whisper-ggml", "whisper-rs?/cuda"]

[dependencies]
anyhow = "1.0.102"
candle-core = { version = "0.11", optional = true }
candle-nn = { version = "0.11", optional = true }
# Pre-split regexes for the OmniVoice text frontend and tokenizer, GPT-SoVITS Chinese number normalization, and IndexTTS2 number normalization (all need lookaround).
fancy-regex = "0.18.0"
# GPT-SoVITS text frontend and phonetic annotation: zlib decompression of the embedded dictionary.
flate2 = "1.1.9"
hound = "3.5.1"
# Tokenization for languages written without spaces (Japanese, Thai, etc.): the segment text is split when estimating word timings.
icu_segmenter = "2.2"
libc = "0.2.189"
memmap2 = "0.9.11"
# Output of local text-to-image (`cuccut.image-png/v1`).
png = "0.18.1"
# Initial noise for candle text-to-image: drawn on the host from the seed (candle's CPU device cannot set a seed).
rand_chacha = { version = "0.9", optional = true }
rand_distr = { version = "0.5", optional = true }
realfft = "3.5.0"
# GPT-SoVITS text frontend: tokenization and English normalization.
regex = "1.13.1"
# The candle backend reads safetensors shards on demand (not the whole file into memory).
safetensors = { version = "0.8", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
unicode-general-category = "1.1"
# NFC normalization for the OmniVoice tokenizer, NFKD for GPT-SoVITS English normalization, NFKC for the IndexTTS2 text frontend.
unicode-normalization = "0.1.25"
# Fallback for automatic language identification: when the model does not report a language, judge from the accumulated text.
whatlang = "0.18"
# raw-api: exposes whisper_rs_sys, for ggml device enumeration and dynamic backend loading.
whisper-rs = { version = "0.16", optional = true, features = ["raw-api"] }

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
# All MLX crates must be the same version: two copies of pmetal-mlx-sys would each link a libmlx.
mlx-rs = { package = "pmetal-mlx-rs", version = "0.25.8", features = ["safetensors"], optional = true }
mlx-sys = { package = "pmetal-mlx-sys", version = "0.2.4", optional = true }
# CoreML (Whisper): half-precision cache for MLMultiArray and Objective-C bindings.
half = { version = "2.7.1", optional = true }
objc2 = { version = "0.6.4", optional = true }
objc2-core-ml = { version = "0.3.2", optional = true }
objc2-foundation = { version = "0.3.2", optional = true }

[dev-dependencies]
tempfile = "3.27.0"
