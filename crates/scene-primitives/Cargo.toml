[package]
name = "scene-primitives"
description = "CucCut render core's deterministic primitives and BCF scene parsing: easing, color, SVG paths and stroke styles, time expressions, channel sampling, text layout and glyph cells, SVG animation, mixing constants, content fingerprints, static layout, plus the resolve → Ir pipeline and lint consumed by the render entry point. Pure functions, no I/O (ported from CucCut v2 ccut-core)"
version.workspace = true
edition.workspace = true
license-file.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0"
motion = { workspace = true }
# `events[].phase` expression evaluation (sin / cos / pow / floor): the same libm as `motion`.
libm = "0.2.16"
serde = { version = "1.0.229", features = ["derive"] }
# `float_roundtrip`: a decimal read as f64 must be correctly rounded, the same value as std `str::parse` and JS `JSON.parse`
# (v2 turns it on at the workspace level; declared with the crate here).
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }
# v2 uses 0.10; this repo resolves to 0.11, so this repo's version is kept.
sha2 = "0.11.0"
roxmltree = "0.20"
unicode-segmentation = "1.12"
unicode-linebreak = "0.1.5"
