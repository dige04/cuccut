[package]
name = "speech-worker"
description = "CucCut's subtitle and translation Worker (architecture design §7.9, §13.1): a separate process that runs a transcript translation with speech-doc; model calls go back to the Runtime over stdio, and it only writes to staging"
version.workspace = true
edition.workspace = true
license-file.workspace = true
publish.workspace = true

[[bin]]
name = "speech-worker"
path = "src/main.rs"

[dependencies]
editor-semantics.workspace = true
speech-doc.workspace = true
speech-doc-bridge.workspace = true
video-model.workspace = true
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }

[dev-dependencies]
tempfile = "3.27.0"
