[package]
name = "video-engine"
description = "CucCut's video engine and video storage: single writer, transactions, receipts, undo, outbox (architecture design §2.3, §5.1, §5.2)"
version.workspace = true
edition.workspace = true
license-file.workspace = true
publish.workspace = true

[dependencies]
editor-semantics.workspace = true
message-ref.workspace = true
# Semantic anchors are evaluated with the same word projection used for script-based ducking (`text_plan`).
render-graph.workspace = true
# When importing Lottie assets, size and duration are read with the kernel's reader (JSON or a `.lottie` archive); `media` is not enabled, so no decoding or fonts are pulled in.
render-raster.workspace = true
timeline.workspace = true
video-model.workspace = true
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
uuid = { version = "1.26.1", features = ["v4"] }

[dev-dependencies]
tempfile = "3.27.0"
