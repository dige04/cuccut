[package]
name = "credential-helper"
description = "CucCut credential helper: the Runtime calls it as a child process and reads and writes the macOS Keychain and Windows Credential Manager over one JSON line on stdin/stdout (architecture design §6.8)"
version.workspace = true
edition.workspace = true
license-file.workspace = true
publish.workspace = true

[lib]
name = "credential_helper"
path = "src/lib.rs"

[[bin]]
name = "credential-helper"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

# macOS Keychain and Windows Credential Manager; other platforms explicitly answer unsupported.
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7.0"

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["windows-native"] }
