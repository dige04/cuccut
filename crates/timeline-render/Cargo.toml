[package]
name = "timeline-render"
description = "CucCut's drawing layer for timeline elements: elements (shapes, stickers, visualizers, progress, confetti, hand-drawn) → DrawOp instruction stream and live scene nodes derived from the same source, plus texture nodes for external media and the BCS2 scene wire format. Pure functions, no I/O; shared by export and preview (ported from CucCut v2 ccut-timeline-render)"
version.workspace = true
edition.workspace = true
license-file.workspace = true
publish.workspace = true

# ── Why this is a **new crate** rather than putting this code into `render-raster` (v2's original comment, with the crate name changed to v3's):
#
# `render-raster` is the **primitive layer** and `timeline` is the **contract layer**, which sits above it. Having `render-raster`
# depend directly on `timeline` would **reverse** this edge: the primitive layer would then know about `ShapeProps` / `Place` /
# `ElementKind`, the fact that "`render-raster` does not depend on `timeline`" would no longer hold, and the "host maps into pure parameter structs"
# (`VisualizerParams` / `ProgressParams` / `VizBox`) that avoids that edge would be wasted. The graph is acyclic (`timeline`
# does not depend on `render-raster`), so this is a layering problem rather than a compile-time one: compiling is not the same as this being the right wiring.
#
# This crate is where that edge belongs — **the layer where the two meet**, depending downward on both sides, so neither has to be reversed. Export and the preview WASM
# share one element-drawing implementation, so "fingerprints are bit-identical" is **structural**, not something kept in step by two copies of the code.
#
# The feature table is the same as v2. Builds for WASM use `--no-default-features --features wasm-safe`; the GPU / subtitle
# compositor artifacts additionally add `scene-wire` (the combination of v2 `ccut-wasm-gpu` and `ccut-wasm-subtitle`).
[features]
default = []
media = ["render-raster/media"]
wasm-safe = ["render-raster/wasm-safe"]
# Enabled only by the browser GPU artifacts. The base CPU wasm does not need external media nodes, and must not pull this geometry/adapter code
# into the first-screen bundle just because it shares the evaluation crate.
external-media-scene = []
# BCS2 is the cross-wasm boundary from the subtitle planner to the GPU compositor; both ends enable it explicitly in their lazily loaded artifacts,
# while the base CPU wasm does not encode or decode the retained scene.
scene-wire = ["external-media-scene"]

[dependencies]
anyhow = "1.0"
motion = { workspace = true }
timeline = { workspace = true }
# The workspace registry is `default-features = false`: this crate only uses `drawop` and `source`, both present on
# both the `media` and `wasm-safe` sides. The final consumer decides which side applies; the two pass-through features above let the consumer
# declare it explicitly, without having to add a `render-raster` edge of its own.
render-raster = { workspace = true }

[dev-dependencies]
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }
