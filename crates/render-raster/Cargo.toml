[package]
name = "render-raster"
description = "CucCut's CPU render core: the DrawOp frame instruction IR (deterministic binary encoding and fingerprints), tiny-skia rasterization replay, the text engine (cosmic-text + swash, strict mode for document fonts), effects / filters / masks / transitions, procedural sources (Lottie, confetti, progress, visualizers, hand-drawn), the CPU executor for the frame plan, BCF layout and recording, and image comparison; the built-in fonts are in `assets/fonts/` (ported from CucCut v2 ccut-render)"
version.workspace = true
edition.workspace = true
license-file.workspace = true
publish.workspace = true

# v2's feature table is kept as is, including names and gates (the `compile_error!` at the top of `src/lib.rs`).
#
# `media` is **on by default** as the host byte layer (same as v2): asset loading (`assets`), frame supply (`media`,
# platform-native decoding as the main path, with the ffmpeg pipe as fallback), ffmpeg audio mixing and MP4 composition (`audio` / `video`), and the built-in fonts'
# `include_bytes!`. Two points differ from v2:
# - v2's `ccut-exec` (external binary discovery) was decided in architecture design §13.6 not to be ported; the small part that `media` uses
#   is folded into this crate's `src/exec.rs`, with v3's lookup rules (`CUCCUT_FFMPEG` / `CUCCUT_FFPROBE`, then `PATH`);
# - v2's `ccut-compile` (BCF compilation, oxc + rquickjs) is likewise not ported. In v2 it was a hard dependency of `media`, serving only
#   `program` assets; here it is split into its own `program` feature, which `media` does not pull in.
#
# Builds for WASM always use `--no-default-features --features wasm-safe`; the `[workspace.dependencies]` registry in the root `Cargo.toml`
# already sets `default-features = false`, so a consumer that does not explicitly ask for `media` does not get it.
# `wasm-safe` turns nothing on by itself; its minimal set comes from "not enabling `media`" (same as v2).
#
# `svg`: just resvg's SVG raster (`src/svg.rs`, without `text`); the browser-preview wasm enables it too —
# SVG assets and sticker recoloring are rasterized in the kernel, and preview and export use the same implementation (architecture design §9.1). `media` is its superset.
#
# `gpu-runtime` / `wgsl-validate` / `gpu` / `gpu-web*`: source is brought over; the dependencies (wgpu 30, naga 30,
# pollster 1) are resolved into Cargo.lock later, in the "GPU compositing and preview WASM" batch; this batch only holds placeholders.
[features]
default = ["media"]
# The App release build reads shared fonts from the signed package instead (Electron uses `Resources/web/assets`, the older native App uses `Resources/fonts`).
external-fonts = ["media"]
media = [
    "dep:tempfile",
    "dep:resvg",
    "dep:media-probe",
    "dep:media-native",
    "dep:symphonia",
    "dep:audio-dsp",
    "dep:rustybuzz",
    "svg",
    "resvg/text",
]
svg = ["dep:resvg", "resvg/raster-images"]
# v3 placeholder: `program` assets (the BCF TSX module graph evaluated frame by frame into SVG, then rasterized by resvg). In v2 it was part of `media`
# (`dep:ccut-compile`); `ccut-compile` is not ported (§13.6). When not enabled, `program` assets error at load time,
# and `src/program.rs` and the tests gated behind it do not compile; enabling it fails to compile at the gate in `lib.rs`.
program = ["media"]
wasm-safe = []
# v2: `gpu-runtime = ["dep:wgpu"]`
gpu-runtime = []
# v2: `wgsl-validate = ["dep:naga"]`. Parse and validate WGSL with naga before building the pipeline.
wgsl-validate = []
# v2: `gpu = ["gpu-runtime", "wgsl-validate", "dep:pollster", "wgpu/metal", "wgpu/vulkan", "wgpu/dx12"]`
gpu = ["gpu-runtime", "wgsl-validate"]
# The two GPU wasm builds for the browser (WebGPU / WebGL2); `gpu-web` is the old name for enabling both.
gpu-web = ["gpu-webgpu", "gpu-webgl"]
# v2: `gpu-webgpu = ["gpu-runtime", "wgpu/webgpu"]`
gpu-webgpu = ["gpu-runtime"]
# v2: `gpu-webgl = ["gpu-runtime", "wgsl-validate", "wgpu/webgl"]`
gpu-webgl = ["gpu-runtime", "wgsl-validate"]

[dependencies]
scene-primitives = { workspace = true }
motion = { workspace = true }
# Only the **read** side of BCS1 is used (format layer + element-level remapping): the workspace registry turns `dsp` off,
# so realfft/rustfft do not enter this crate's dependency graph (§9.1 wasm boundary).
waveform = { workspace = true }
anyhow = "1.0"
# Closed-form confetti kernel and unit-shape transcendentals (`source/confetti/{kernel,shapes}.rs`): the sampled
# results cross the wasm boundary as-is, so native and wasm32 must be bit-identical.
libm = "0.2.16"
# `float_roundtrip`: a decimal read as f64 must be correctly rounded (v2 turns it on at the workspace level; declared with the crate here).
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }
tiny-skia = "0.11.4"
cosmic-text = "0.19"
swash = "0.2"
# v2 uses 0.10; this repo resolves to 0.11, so this repo's version is kept.
sha2 = "0.11.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
# Deflate decompression for `.lottie` archives (`source/lottie/archive.rs`; the hand-written central-directory reader does not use the zip crate). Already in the dependency graph
# (the copy pulled in by png / flate2), pure Rust, goes into wasm.
miniz_oxide = "0.8"

# ── Specific to `media` (follows `media`; not in the `wasm-safe` dependency graph).
# The only implementation of media probing (duration / dimensions / fps / alpha).
media-probe = { workspace = true, optional = true }
# Platform-native decoding (AVFoundation / Media Foundation). The **frame-by-frame supply main path** for the render pipeline
# (`media.rs`); the ffmpeg pipe is the fallback when it cannot decode; and the native encoding backend for the final video (`video.rs`).
media-native = { workspace = true, optional = true }
# The pure-Rust main path for audio decoding (`audio/decode.rs`). Versions and features are aligned with `media-probe`.
symphonia = { version = "0.6", features = ["all"], optional = true }
# The mixing chain (ducking, BS.1770 loudness, true-peak limiting).
audio-dsp = { workspace = true, optional = true }
# `resvg` is called from `svg.rs` for SVG rasterization and from `program.rs` for per-frame rasterization; the `svg` feature brings it in on its own
# (browser-preview wasm). A patched resvg 0.45.1 (nested-layer clamping, filter regions), with source in
# `vendor/ccut-resvg/` (see its README.md). `text` follows `media` only; `raster-images` lets embedded
# data-URI textures be drawn.
resvg = { package = "ccut-resvg", path = "vendor/ccut-resvg", default-features = false, optional = true }
# Same version used for usvg typesetting (pinned at 0.20), so the measured text widths line up.
rustybuzz = { version = "0.20", optional = true }
# Only the mixing temp file in `video.rs` uses it; `getrandom` on wasm32-unknown-unknown
# needs an explicit backend, and by not entering `wasm-safe`'s dependency graph this cfg is avoided.
tempfile = { version = "3", optional = true }
# Two more that v2 has but are not ported (§13.6):
# ccut-exec = { path = "../ccut-exec", optional = true }        → `src/exec.rs`
# ccut-compile = { path = "../ccut-compile", optional = true }  → placeholder for the `program` feature
#
# ── Specific to `gpu` (v2 original text, pending the "GPU compositing and preview WASM" batch).
# wgpu = { version = "30", default-features = false, features = ["std", "parking_lot", "wgsl"], optional = true }
# naga = { version = "30", default-features = false, features = ["wgsl-in", "glsl-out"], optional = true }
# pollster = { version = "1", optional = true }

[dev-dependencies]
tempfile = "3"
# The **generator side** of the fixture needs `bcs1::encode` and `remap`: enable `dsp`.
waveform = { workspace = true, features = ["dsp"] }
# The **generator side** of the animated-image fixtures (`write_animated_fixtures`, `#[ignore]`):
# needs precise control of per-frame disposal / blend / loop count, which `image`'s encoder cannot give.
gif = "0.14"
png = "0.18"
# The final-video encoding backend acceptance (`tests/encode_backends.rs`) probes the written MP4 and asks whether this machine has a native encoding
# backend. The two formal dependencies are `optional` (they follow `media`); test targets do not inherit optional dependencies, so they are declared again here.
media-probe = { workspace = true }
media-native = { workspace = true }

[[example]]
name = "bcf_stage_bench"
required-features = ["media"]
