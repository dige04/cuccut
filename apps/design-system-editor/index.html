<!doctype html>
<html lang="en" class="cds-root" data-density="comfortable" data-thumb-defer>
<head>
<meta charset="utf-8">
<!--
  CucCut design system editor page (docs/design/canvas §10.2), adapted from the original Design System type page. The runtime serves it under /design-system/<grant>/,
  and the host is installed by src/main.ts. Differences from the original page:
  - The inline script at the top of the original page asks the parent window for feature flags (__appifact_flags) and installs health reporting (__appifact_health).
    Here only __appifact_flags is installed, with fixed values (the next script); health reporting is not installed.
  - appifact-capabilities drops room (single user); the rest is kept as is. The runtime reads only db (to decide how to store) and downloads (whether downloads are declared) from it.
  - No README comment or meta (written for Claude on the hosting platform; CucCut's instructions live in the design-system skill).
  - Styles and scripts are bundled by Vite from src/main.ts into assets/; there is no longer artifact-type/app.css or artifact-type/app.js. artifact-type/ holds only
    the preview run.html (unchanged) and the React UMD used for preview (vendor/).
-->
<script>
// Fixed feature flags, using the original values, not requested from the host (docs/design/canvas §10.2):
//   design_system_clean_up_button  true  On systems whose migration is unfinished, shows “Finish the migration” at the top (editor/migration-banners.tsx)
(function(){var values={design_system_clean_up_button:true};function kind(v){return v===null?"null":Array.isArray(v)?"array":typeof v}function copy(v){return JSON.parse(JSON.stringify(v))}globalThis.__appifact_flags={version:"appifact-flags:v1",ready:function(){return Promise.resolve(true)},get:function(key,fallback){if(!Object.prototype.hasOwnProperty.call(values,key)||kind(values[key])!==kind(fallback))return fallback;return copy(values[key])},all:function(){return copy(values)}};})();
</script>
<title>Design System</title>
<meta name="appifact-capabilities" content="{&quot;artifact&quot;:{},&quot;downloads&quot;:{},&quot;user&quot;:{&quot;scopes&quot;:[&quot;profile&quot;]},&quot;assets&quot;:{},&quot;comments&quot;:{&quot;composer_only&quot;:true,&quot;customAnchors&quot;:true},&quot;db&quot;:{&quot;rules&quot;:[{&quot;path&quot;:&quot;&quot;,&quot;write&quot;:&quot;admin&quot;}]}}">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script id="appifact-mode">(function(){var h=document.documentElement;function s(){var t=h.getAttribute('data-theme');if(t==='light'||t==='dark'){h.setAttribute('data-mode',t)}else{h.removeAttribute('data-mode')}}s();if(typeof MutationObserver==='function'){new MutationObserver(s).observe(h,{attributes:true,attributeFilter:['data-theme']})}})();</script>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
