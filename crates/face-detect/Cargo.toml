[package]
name = "face-detect"
description = "CucCut face detection (videos_frames' faces): YuNet (OpenCV Zoo, ONNX) run through the pure-Rust tract inference engine; the Runtime calls it as a child process over JSON lines on stdin/stdout. Windows and macOS share one implementation with no native runtime libraries bundled"
version.workspace = true
edition.workspace = true
license-file.workspace = true
publish.workspace = true

[lib]
name = "face_detect"
path = "src/lib.rs"

[[bin]]
name = "face-detect"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.102"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# Pure-Rust ONNX inference: onnxruntime's DLL / dylib are not shipped with the app, and release builds (`--locked`) do not download native libraries at build time.
tract-onnx = "0.23.8"
