<!doctype html>
<html lang="en" class="cds-root" data-density="comfortable" data-thumb-defer>
<head>
<meta charset="utf-8">
<!--
  CucCut design editor page (docs/design/canvas §3, §5), adapted from the original Design type page. The runtime serves it under /design/<grant>/, and the host is installed by src/main.ts.
  Differences from the original page:
  - The inline script at the top of the original page asks the parent window for feature flags (__appifact_flags) and installs health reporting (__appifact_health).
    Here only __appifact_flags is installed, with fixed values (the next script); health reporting is not installed.
  - appifact-capabilities drops room (single user), sample (it does not provide the model calls that quick edit needs) and flags (the switches are fixed). The runtime reads only
    db (when present, thumbnails and the like are drawn after completion, same as data-thumb-defer) and downloads (export is handed to the host to save; falls back to a browser download when there is no host).
  - No README comment or meta (written for Claude on the hosting platform; CucCut's instructions live in the design skill) and no mega-build-stamp;
    it does not preload from /_runtime/ and does not declare Anthropic Sans (no built-in brand font; see packages/design-runtime/README.md).
  dc-runtime-file and fast-edit-worker-file are the same as in the original page, pointing to the artboard runtime and the fast-edit Worker produced by build.mjs (relative page URLs).
  dc-babel-file is added: the runtime loads Babel only when an artboard x-imports JSX; the original fetches it from a CDN, but CucCut's CSP does not allow CDNs, so it is fetched from here instead.
-->
<script>
// Fixed feature flags. The values are the defaults the runtime uses wherever it reads a flag (docs/design/canvas §3); not requested from the host:
//   design_fast_edit                  false                Quick edit off (CucCut does not provide sample)
//   design_fast_edit_sample           {modelTier:"quick"}
//   design_cross_canvas_paste_confirm true                 Before pasting artboards from another design, asks the user whether to trust the code in them
//   design_artboards_at_address       false
//   appifact_extra_export_formats     false
//   appifact_creation_sequence        false
(function(){var values={design_fast_edit:false,design_fast_edit_sample:{modelTier:"quick"},design_cross_canvas_paste_confirm:true,design_artboards_at_address:false,appifact_extra_export_formats:false,appifact_creation_sequence:false};function kind(v){return v===null?"null":Array.isArray(v)?"array":typeof v}function copy(v){return JSON.parse(JSON.stringify(v))}globalThis.__appifact_flags={version:"appifact-flags:v1",ready:function(){return Promise.resolve(true)},get:function(key,fallback){if(!Object.prototype.hasOwnProperty.call(values,key)||kind(values[key])!==kind(fallback))return fallback;return copy(values[key])},all:function(){return copy(values)}};})();
</script>
<title>Design</title>
<meta name="appifact-capabilities" content="{&quot;downloads&quot;:{},&quot;artifact&quot;:{},&quot;comments&quot;:{&quot;composer_only&quot;:true,&quot;customAnchors&quot;:true},&quot;db&quot;:{&quot;rules&quot;:[{&quot;path&quot;:&quot;&quot;,&quot;write&quot;:&quot;admin&quot;}]},&quot;assets&quot;:{},&quot;user&quot;:{&quot;scopes&quot;:[&quot;profile&quot;]}}">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="dc-runtime-file" content="artifact-type/dc-runtime.js">
<meta name="fast-edit-worker-file" content="artifact-type/fast-edit-worker.js">
<meta name="dc-babel-file" content="artifact-type/babel.min.js">
<script>try{if(!document.documentElement.getAttribute("data-theme"))document.documentElement.setAttribute("data-theme",matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light")}catch(e){}</script>
<script id="appifact-mode">(function(){var h=document.documentElement;function s(){var t=h.getAttribute('data-theme');if(t==='light'||t==='dark'){h.setAttribute('data-mode',t)}else{h.removeAttribute('data-mode')}}s();if(typeof MutationObserver==='function'){new MutationObserver(s).observe(h,{attributes:true,attributeFilter:['data-theme']})}})();</script>
</head>
<body>
<div id="root"><p data-placeholder style="margin:24px;font:13px system-ui,sans-serif;color:#888">Loading…</p></div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
