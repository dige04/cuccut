[package]
name = "media-probe"
description = "CucCut unified media probe: pure-Rust container/geometry/duration inspection with optional ffprobe fallback (ported from CucCut v2 ccut-media-probe)"
version.workspace = true
edition.workspace = true
license-file.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0"
# `float_roundtrip`: a decimal read as f64 must be correctly rounded, giving the same value as std `str::parse` and JS `JSON.parse`
# (v2 turns it on at the workspace level; here it is declared by the crate).
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }
# Audio container and duration: does not decode packets, only reads `Track.duration + time_base` (WP2 promoted
# symphonia to the main audio decoding path, so it uses the same version and features here and adds no compilation unit).
symphonia = { version = "0.6", features = ["all"] }
# MP4 / MOV (ISO-BMFF): derived from mp4-rust maintained by rerun-io; MIT, pure Rust with zero C dependencies.
# `Mp4::read` works with `Read + Seek` and skips `mdat`, so even multi-GB files only read box headers.
re_mp4 = "0.5"
# MKV / WebM: hasenbanck/matroska-demuxer, Zlib OR MIT OR Apache-2.0, **zero dependencies**.
# The only hard reason for choosing it: of the Matroska crates surveyed, it is the only one that decodes `AlphaMode`
# (0x53C0) and exposes it as `Video::alpha_mode()`; the test for WebM stickers with alpha relies
# entirely on it (symphonia's mkv demuxer recognizes this ID but discards it).
matroska-demuxer = "0.8"
# Images: only the header dimensions are read (`image::ImageReader` does not decode pixels).
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "gif",
    "webp",
    "bmp",
    "tiff",
] }

[dev-dependencies]
tempfile = "3"
