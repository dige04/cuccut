[package]
name = "motion"
description = "CucCut's shared animation kernel: easing and spring curves, keyframe sampling, the registry of presets / effects / text presets (built-in manifests embedded via include_str!), flow compilation and the per-word motion split. Pure functions, no I/O; transcendental functions go through libm only (ported from CucCut v2 ccut-motion)"
version.workspace = true
edition.workspace = true
license-file.workspace = true
publish.workspace = true

[dependencies]
# Transcendental functions go through libm only: std's methods of the same name call the system libm on macOS native and compiler-builtins on wasm32,
# so the last digit differs and the poses computed by export and preview do not match. The gate is in `tests/libm_only.rs`.
libm = "0.2.16"
serde = { version = "1.0.229", features = ["derive"] }
# `float_roundtrip`: a decimal read as f64 must be correctly rounded, the same value as std `str::parse` and JS `JSON.parse`.
# Built-in preset constants read 1 ULP off, so preview and export disagree on element-boundary frames (the gate is in `tests/float_parse.rs`;
# v2 turns it on at the workspace level; declared with the crate here).
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }
unicode-segmentation = "1.12"

[dev-dependencies]
# Migration evidence: the easing implementation must be bit-identical to the old implementation in `scene-primitives` (v2 likewise has a cycle in the dev direction).
scene-primitives = { workspace = true }
