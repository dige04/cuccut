[package]
name = "engine-host"
description = "CucCut's Engine Host: a separate process that holds the video write lock and talks to the Runtime over JSON lines on stdio (architecture design §2.3)"
version.workspace = true
edition.workspace = true
license-file.workspace = true
publish.workspace = true

[[bin]]
name = "engine-host"
path = "src/main.rs"

[dependencies]
editor-semantics.workspace = true
font-files.workspace = true
message-ref.workspace = true
render-graph.workspace = true
video-engine.workspace = true
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[dev-dependencies]
tempfile = "3.27.0"
