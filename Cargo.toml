[workspace]
resolver = "3"
# The patched resvg brought in by `render-raster` (v2 `core/vendor/ccut-resvg`, see its README.md) is `media`'s
# dependency. As in v2, it is a workspace member, and the byte-for-byte upstream gate in `tests/patches.rs` runs with the workspace tests.
members = ["crates/*", "bindings/*", "crates/render-raster/vendor/ccut-resvg"]

[workspace.package]
version = "0.4.0"
edition = "2024"
license-file = "LICENSE"
publish = false

[workspace.dependencies]
editor-semantics = { path = "crates/editor-semantics" }
message-ref = { path = "crates/message-ref" }
model-runtime = { path = "crates/model-runtime", default-features = false }
video-engine = { path = "crates/video-engine" }
video-model = { path = "crates/video-model" }
render-graph = { path = "crates/render-graph" }
frame-render = { path = "crates/frame-render", default-features = false }
media-core = { path = "crates/media-core" }
motion = { path = "crates/motion" }
scene-primitives = { path = "crates/scene-primitives" }
speech-doc = { path = "crates/speech-doc" }
font-files = { path = "crates/font-files" }
audio-dsp = { path = "crates/audio-dsp" }
media-probe = { path = "crates/media-probe" }
media-native = { path = "crates/media-native" }
# `media` is off by default (ffmpeg subprocess, host resvg, platform codecs, bundled fonts): a consumer that does not ask for it gets the minimal `wasm-safe`
# set, so the WASM build graph never picks up `media` through feature unification. A consumer that needs the host byte layer adds
# `features = ["media"]` itself.
render-raster = { path = "crates/render-raster", default-features = false }
# `dsp` (STFT, realfft/rustfft) is off by default: consumers that only read BCS1 do not pull it into WASM; a producer of spectra adds `features = ["dsp"]` itself.
waveform = { path = "crates/waveform", default-features = false }
speech-doc-bridge = { path = "crates/speech-doc-bridge" }
timeline = { path = "crates/timeline" }
timeline-render = { path = "crates/timeline-render" }
# `host` (project I/O, media decoding, system fonts, via `render-raster/media`) is off by default, as with `render-raster`:
# a WASM consumer uses `features = ["wasm-safe"]`, and a consumer that needs host capabilities adds `features = ["host"]` itself.
subtitle-render = { path = "crates/subtitle-render", default-features = false }

# Preview WASM: size first; used only with `--profile wasm`, and does not affect the native engine-host.
[profile.wasm]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Build scripts and proc macros are host dynamic libraries, and `strip` removes the symbols they export, so a fresh target directory cannot find serde_derive and the like.
[profile.wasm.build-override]
strip = false

# Native release is the same: the default `strip = "debuginfo"` breaks proc-macro dynamic libraries in a fresh target directory (the linker reports mis-aligned LINKEDIT).
[profile.release.build-override]
strip = false

# The preview draws every frame in WASM, so the rasterizing crates are optimized for speed (at 960×540 one frame is more than three times slower when optimized for size).
# See also the SIMD that tools/build-wasm.mjs enables for wasm32.
[profile.wasm.package.tiny-skia]
opt-level = 3
[profile.wasm.package.tiny-skia-path]
opt-level = 3
[profile.wasm.package.render-raster]
opt-level = 3
[profile.wasm.package.subtitle-render]
opt-level = 3
[profile.wasm.package.frame-render]
opt-level = 3

# In debug builds, the export and preview tests also rasterize frame by frame: if these crates are not optimized, one frame is an order of magnitude slower and export tests time out.
[profile.dev.package.tiny-skia]
opt-level = 3
[profile.dev.package.tiny-skia-path]
opt-level = 3
[profile.dev.package.render-raster]
opt-level = 3
[profile.dev.package.subtitle-render]
opt-level = 3
[profile.dev.package.frame-render]
opt-level = 3
# The remaining per-frame export paths: the Worker itself (moving frames, premultiplying), pipe reads and writes for decode and encode, plan computation, and cosmic-text / swash / rustybuzz for layout;
# in dev mode (`npm run dev` uses the debug Worker), unoptimized export is more than twice as slow as release.
[profile.dev.package.export-worker]
opt-level = 3
[profile.dev.package.media-core]
opt-level = 3
[profile.dev.package.media-native]
opt-level = 3
[profile.dev.package.render-graph]
opt-level = 3
[profile.dev.package.cosmic-text]
opt-level = 3
[profile.dev.package.swash]
opt-level = 3
[profile.dev.package.rustybuzz]
opt-level = 3
[profile.dev.package.serde_json]
opt-level = 3

# CPU tensor operations and matrix multiplication for the candle backend (`backend-candle`): unoptimized, recognition tests with real weights run more than 100 times slower.
[profile.dev.package.candle-core]
opt-level = 3
[profile.dev.package.candle-nn]
opt-level = 3
[profile.dev.package.gemm]
opt-level = 3
[profile.dev.package.gemm-common]
opt-level = 3
[profile.dev.package.gemm-f16]
opt-level = 3
[profile.dev.package.gemm-f32]
opt-level = 3
[profile.dev.package.pulp]
opt-level = 3
