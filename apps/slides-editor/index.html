<!doctype html>
<html lang="en" class="cds-root" data-density="comfortable" data-thumb-defer>
<head>
<meta charset="utf-8">
<!--
  CucCut slides editor page (docs/design/slides §3, §5). The runtime serves it under /slides/<grant>/, and the host is installed by src/main.ts.
  appifact-capabilities is the capability declaration the runtime reads: only with db does it start in deck file mode (boot/bootstrap.ts), and only with downloads is export enabled;
  it does not declare room (single user) or mcp (no Google Drive). appifact-mode is the runtime's light/dark mode bootstrap script; it is carried over as is when exporting a single-page HTML.
-->
<meta name="appifact-capabilities" content="{&quot;downloads&quot;:{},&quot;artifact&quot;:{},&quot;comments&quot;:{&quot;composer_only&quot;:true,&quot;customAnchors&quot;:true},&quot;db&quot;:{&quot;rules&quot;:[{&quot;path&quot;:&quot;&quot;,&quot;write&quot;:&quot;admin&quot;},{&quot;path&quot;:&quot;notes&quot;,&quot;read&quot;:&quot;admin&quot;,&quot;write&quot;:&quot;admin&quot;}]},&quot;assets&quot;:{},&quot;user&quot;:{&quot;scopes&quot;:[&quot;profile&quot;]}}">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script id="appifact-mode">(function(){var h=document.documentElement;function s(){var t=h.getAttribute('data-theme');if(t==='light'||t==='dark'){h.setAttribute('data-mode',t)}else{h.removeAttribute('data-mode')}}s();if(typeof MutationObserver==='function'){new MutationObserver(s).observe(h,{attributes:true,attributeFilter:['data-theme']})}})();</script>
<title>Slides</title>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
