[package]
name = "speech-doc"
description = "CucCut's pure-logic core for transcript post-processing, translation, subtitle alignment and subtitle export (ported from CucCut v2 ccut-flow-core; zero I/O, zero network)"
version.workspace = true
edition.workspace = true
license-file.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0"
serde = { version = "1.0.229", features = ["derive"] }
# `float_roundtrip`: a decimal read as f64 must be correctly rounded, the same value as std `str::parse` and JS `JSON.parse`.
# The default fast path reads 17-significant-digit numbers 1 ULP off; word timings and fingerprints in transcript.json depend on bit-exact results
# (v2 turns it on at the workspace level; declared with the crate here).
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }
regex = "1.12"
html5ever = "0.39"
markup5ever_rcdom = "0.39"
icu_segmenter = "2.2"
unicode-general-category = "1.1"
unicode-normalization = "0.1"
unicode-segmentation = "1.12"
