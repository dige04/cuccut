[package]
name = "export-worker"
description = "CucCut's Render Worker (architecture design §9.13, §13.1): a separate process that computes the plan frame by frame from frozen export input, composites, and hands frames to the encoder (platform-native first, ffmpeg as fallback); cancellable, with progress as JSON lines on stdout"
version.workspace = true
edition.workspace = true
license-file.workspace = true
publish.workspace = true

[[bin]]
name = "export-worker"
path = "src/main.rs"

[features]
external-fonts = ["frame-render/external-fonts"]

[dependencies]
audio-dsp.workspace = true
editor-semantics.workspace = true
font-files.workspace = true
media-core.workspace = true
media-native.workspace = true
frame-render = { workspace = true, features = ["host"] }
render-graph.workspace = true
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tiny-skia = { version = "0.11.4", default-features = false, features = ["std", "simd"] }
video-model.workspace = true

[dev-dependencies]
tempfile = "3.27.0"
