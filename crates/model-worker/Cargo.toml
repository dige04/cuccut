[package]
name = "model-worker"
description = "CucCut's Model Worker: a separate process that hosts one resident model package for local inference and talks to the Runtime over JSON lines on stdio (architecture design §6.5)"
version.workspace = true
edition.workspace = true
license-file.workspace = true
publish.workspace = true

[[bin]]
name = "model-worker"
path = "src/main.rs"

[features]
default = ["backend-mlx", "backend-coreml"]
backend-mlx = ["model-runtime/backend-mlx"]
backend-coreml = ["model-runtime/backend-coreml"]
backend-candle = ["model-runtime/backend-candle"]
cuda = ["backend-candle", "model-runtime/cuda"]
whisper-ggml = ["backend-candle", "model-runtime/whisper-ggml"]
whisper-ggml-vulkan = ["whisper-ggml", "model-runtime/whisper-ggml-vulkan"]
whisper-ggml-metal = ["whisper-ggml", "model-runtime/whisper-ggml-metal"]
# Whisper on NVIDIA uses ggml's CUDA backend (requires the CUDA Toolkit; independent of candle's `cuda`, and the CUDA installer enables both). Not yet measured.
whisper-ggml-cuda = ["whisper-ggml", "model-runtime/whisper-ggml-cuda"]

[dependencies]
libc = "0.2.189"
model-runtime.workspace = true
serde_json = "1.0.151"

[dev-dependencies]
hound = "3.5.1"
# The end-to-end text-to-image test decodes `image.png`.
png = "0.18.1"
sha2 = "0.11.0"
tempfile = "3.27.0"
