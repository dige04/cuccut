[package]
name = "font-files"
description = "CucCut finds one face of an installed font by family name, weight and italic, and extracts it from the font collection as a standalone font (ported from the system font library of CucCut v2 ccut-render). Export and preview share the same parsing and extraction; there is a size cap, and the whole font directory is not listed"
version.workspace = true
edition.workspace = true
license-file.workspace = true
publish.workspace = true

[dependencies]
fontdb = "0.23"

[dev-dependencies]
tempfile = "3.27.0"
