[package]
name = "face-detect"
description = "CucCut 的人脸检测（videos_frames 的 faces）：YuNet（OpenCV Zoo，ONNX）经纯 Rust 的 tract 推理；Runtime 以子进程调用，stdin/stdout 的 JSON 行；Windows 与 macOS 同一份实现，不带原生运行库"
version.workspace = true
edition.workspace = true
license-file.workspace = true
publish.workspace = true

[lib]
name = "face_detect"
path = "src/lib.rs"

[[bin]]
name = "face-detect"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.102"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# 纯 Rust 的 ONNX 推理：不随应用分发 onnxruntime 的 DLL / dylib，发布构建（`--locked`）不在构建时下载原生库。
tract-onnx = "0.23.8"
