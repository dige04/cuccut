[package]
name = "render-graph"
description = "CucCut's frame plan (architecture design §9): which layers are on screen at a given moment, how they are placed, each one's source time, and which sounds are playing. Pure functions, shared by native export and the WASM preview"
version.workspace = true
edition.workspace = true
license-file.workspace = true
publish.workspace = true

[dependencies]
editor-semantics.workspace = true
video-model.workspace = true
# Geometry (`place` turned into pixel boxes) uses the single implementation of the v2 element model.
timeline.workspace = true
# Trigonometry and rounding go through libm: std's methods of the same name can differ in the last digit between native and wasm32, and preview and export must match bit for bit.
libm = "0.2.16"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
